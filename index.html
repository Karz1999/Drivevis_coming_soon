<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drivevis Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --road-top: 60vh; --gold: #ffd24a; --ice: #eaf1ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 15%, #1d2c52 0%, #0b1122 55%, #04060c 100%);
    font-family: "Orbitron", "Segoe UI", system-ui, sans-serif; color: #fff;
  }

  /* sky */
  .stars { position: absolute; inset: 0 0 40vh 0; pointer-events: none; }
  .stars i { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: .6; animation: twinkle 3s infinite ease-in-out; }
  @keyframes twinkle { 50% { opacity: .1; } }
  .skyline { position: absolute; left: 0; right: 0; bottom: calc(100vh - var(--road-top)); height: 30vh; display: flex; align-items: flex-end; pointer-events: none; }
  .skyline b { flex: 1 1 auto; position: relative; background: linear-gradient(#121b33, #0a0f1d); border-top: 1px solid #22305a; }
  .skyline b::after {
    content: ""; position: absolute; inset: 10px 6px 0 6px;
    background: repeating-linear-gradient(90deg, rgba(255,205,120,var(--lit)) 0 3px, transparent 3px 9px);
    -webkit-mask: repeating-linear-gradient(0deg, #000 0 3px, transparent 3px 10px);
            mask: repeating-linear-gradient(0deg, #000 0 3px, transparent 3px 10px);
  }
  .horizon-glow { position: absolute; left: 0; right: 0; top: calc(var(--road-top) - 14vh); height: 14vh; background: linear-gradient(transparent, rgba(80,130,255,.18)); pointer-events: none; }

  /* road */
  .road { position: absolute; left: 0; right: 0; top: var(--road-top); bottom: 0; background: linear-gradient(#2b2f37 0%, #1b1e24 60%, #121418 100%); border-top: 3px solid #4a505c; overflow: hidden; }
  .road .lane { position: absolute; left: 0; right: 0; top: 50%; height: 6px; transform: translateY(-50%); background: repeating-linear-gradient(90deg, #e9c43c 0 70px, transparent 70px 130px); box-shadow: 0 0 10px rgba(233,196,60,.35); }
  .road-text {
    position: absolute; left: 0; right: 0; display: flex; justify-content: center;
    font-weight: 900; letter-spacing: .32em; padding-left: .32em;
    font-size: min(7vh, 10vw); line-height: 1;
    transform: perspective(520px) rotateX(34deg); pointer-events: none;
  }
  .road-text.top    { bottom: calc(50% + 1.6vh); color: var(--ice);  --glow: rgba(110,160,255,.85); }
  .road-text.bottom { top:    calc(50% + 2.2vh); color: var(--gold); --glow: rgba(255,190,40,.9); }
  .road-text span { display: inline-block; opacity: 0; }
  .road-text span.in { animation: focusIn 1s cubic-bezier(.2,.8,.2,1) forwards; }
  .road-text.glow span { opacity: 1; text-shadow: 0 0 14px var(--glow), 0 0 34px var(--glow); animation: pulse 2.6s ease-in-out infinite; }
  @keyframes focusIn {
    0%   { opacity: 0; filter: blur(14px); transform: translateY(-30px) scale(1.8); }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; filter: blur(0); transform: none; text-shadow: 0 0 14px var(--glow), 0 0 34px var(--glow); }
  }
  @keyframes pulse { 50% { text-shadow: 0 0 6px var(--glow), 0 0 16px var(--glow); } }

  canvas { position: absolute; inset: 0; pointer-events: none; }

  /* title */
  .title { position: absolute; top: 9vh; left: 16px; right: 16px; display: flex; flex-direction: column; align-items: center; gap: 2.2vh; text-align: center; }
  .line { display: flex; flex-wrap: wrap; justify-content: center; column-gap: .45em; row-gap: .15em; }
  .line .word { display: inline-flex; white-space: nowrap; }
  .line1 { font-size: min(11vw, 13vh, 140px); font-weight: 900; letter-spacing: .06em; }
  .line2 { font-size: min(4.6vw, 6vh, 62px); font-weight: 700; letter-spacing: .14em; }
  .title span.ch {
    display: inline-block; transform: translateY(-130vh);
    background: linear-gradient(180deg, #ffffff 0%, #d4dcee 45%, #8090ad 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 14px rgba(80,140,255,.45));
  }
  .line2 span.ch {
    background: linear-gradient(180deg, #fff3c4 0%, #ffd24a 50%, #c48d12 100%);
    -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 4px 12px rgba(255,190,40,.35));
  }
  .title span.ch.drop { animation: drop .9s cubic-bezier(.3,0,.4,1) forwards; }
  @keyframes drop {
    0%   { transform: translateY(-130vh) rotate(-12deg); }
    60%  { transform: translateY(0) scaleY(.8) scaleX(1.15); }
    72%  { transform: translateY(-28px) scaleY(1.05) scaleX(.97); }
    86%  { transform: translateY(0) scaleY(.95) scaleX(1.03); }
    93%  { transform: translateY(-6px); }
    100% { transform: translateY(0) rotate(0); }
  }
  .tag { font-family: "Rajdhani", sans-serif; font-weight: 500; font-size: min(2.6vh, 3.6vw); letter-spacing: .5em; color: #9fb0d4; opacity: 0; transition: opacity 1.2s; }
  .tag.show { opacity: .85; }

  /* car */
  #car { position: absolute; left: 0; top: 0; width: min(400px, 66vw); height: auto; transform-origin: 50% 90%; will-change: transform; transform: translateX(-120vw); }
  #carBody { transform-box: fill-box; transform-origin: 50% 100%; }
  .wheel { transform-box: fill-box; transform-origin: center; }
  #headGlow { opacity: 0; transition: opacity .4s; }

  /* UI */
  #soundHint, #replay, .credit {
    position: absolute; z-index: 5; bottom: 16px;
    font-family: "Rajdhani", sans-serif; font-weight: 600; font-size: 14px; letter-spacing: .08em;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.22); color: #dfe7f7;
  }
  #soundHint { top: 16px; bottom: auto; right: 16px; opacity: 0; pointer-events: none; transition: opacity .4s; }
  #soundHint.show { opacity: 1; }
  #replay { left: 16px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #replay.show { opacity: .7; pointer-events: auto; }
  #replay:hover { opacity: 1; }
  .credit { right: 16px; text-decoration: none; transition: background .3s, border-color .3s; backdrop-filter: blur(6px); }
  .credit span { color: var(--gold); }
  .contact {
    position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 10px); z-index: 5;
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    font-family: "Rajdhani", sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .06em;
    opacity: 0; transition: opacity 1s, transform 1s; pointer-events: none;
  }
  .contact.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .contact a {
    color: #dfe7f7; text-decoration: none; padding: 6px 12px; border-radius: 999px;
    background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.14); transition: border-color .3s, color .3s;
  }
  .contact a::before { content: "✉ "; color: var(--gold); }
  .contact a:hover { color: #fff; border-color: rgba(255,210,74,.6); }
  @media (max-width: 760px) {
    .contact { bottom: 52px; font-size: 12px; gap: 6px; width: calc(100% - 24px); flex-wrap: nowrap; letter-spacing: .02em; }
    .contact a { padding: 5px 9px; white-space: nowrap; }
  }
  @media (max-width: 480px) {
    #soundHint, #replay, .credit { font-size: 12px; padding: 6px 10px; letter-spacing: .04em; }
    #replay, .credit { bottom: 12px; }
    #soundHint { top: 12px; right: 12px; }
    #replay { left: 12px; } .credit { right: 12px; }
  }
  .credit:hover { background: rgba(255,210,74,.14); border-color: rgba(255,210,74,.6); }
</style>
</head>

<script>
/* ===== CONFIG ===== */
const LINE1 = "WELCOME";
const LINE2 = "DRIVEVIS TECHNOLOGIES";
const ROAD_TOP_WORD = "COMING";
const ROAD_BOTTOM_WORD = "SOON";
const GAP1 = 170, GAP2 = 70;          // ms between letters
const CAR_IN = 2800, HOLD = 700, CAR_OUT = 1600;

const $ = id => document.getElementById(id);
const car = $("car"), carBody = $("carBody");
const wheels = [$("wheelRear"), $("wheelFront")];
const smokeC = $("smoke"), skidC = $("skid");
const sctx = smokeC.getContext("2d"), kctx = skidC.getContext("2d");
let wheelAngle = 0;

for (let i = 0; i < 90; i++) {
  const s = document.createElement("i");
  s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%";
  s.style.animationDelay = Math.random() * 3 + "s";
  $("stars").appendChild(s);
}
(function buildSkyline() {
  const sk = $("skyline"), n = Math.max(10, Math.round(innerWidth / 55));
  for (let i = 0; i < n; i++) {
    const b = document.createElement("b");
    b.style.height = (18 + Math.random() * 82) + "%";
    b.style.flexBasis = (30 + Math.random() * 60) + "px";
    b.style.setProperty("--lit", (0.08 + Math.random() * 0.35).toFixed(2));
    sk.appendChild(b);
  }
})();

function layout() {
  for (const c of [smokeC, skidC]) { c.width = innerWidth; c.height = innerHeight; }
  const road = $("road").getBoundingClientRect();
  const laneY = road.top + road.height * 0.15;
  const h = car.clientWidth * 140 / 400;
  car.style.height = h + "px";
  car.style.top = (laneY - h * 133 / 140) + "px";
}
addEventListener("resize", layout);

/* ---------- audio ---------- */
const ac = new (window.AudioContext || window.webkitAudioContext)();
const master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination);
const noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
{ const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
const noise = () => { const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true; return n; };
const live = () => ac.state === "running";
function unlock() { ac.resume().then(() => { if (live()) $("soundHint").classList.remove("show"); }); }
ac.resume().catch(() => {});
setTimeout(() => { if (!live()) $("soundHint").classList.add("show"); }, 300);
["pointerdown", "keydown", "touchstart"].forEach(e => addEventListener(e, unlock, { passive: true }));

function whistle(t, vol = .07) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(1500, t); o.frequency.exponentialRampToValueAtTime(350, t + .5);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + .52);
  o.connect(g).connect(master); o.start(t); o.stop(t + .55);
}
function thud(t, vol = .55) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + .18);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
  o.connect(g).connect(master); o.start(t); o.stop(t + .3);
  const n = noise(), f = ac.createBiquadFilter(), ng = ac.createGain();
  f.type = "lowpass"; f.frequency.value = 900;
  ng.gain.setValueAtTime(vol * .6, t); ng.gain.exponentialRampToValueAtTime(.0001, t + .12);
  n.connect(f).connect(ng).connect(master); n.start(t); n.stop(t + .15);
}
function engine(t, dur, f0, fPeak, fEnd, peakAt = .35) {
  const o = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = "sawtooth"; o2.type = "square"; f.type = "lowpass"; f.frequency.value = 750;
  for (const [osc, k] of [[o, 1], [o2, .5]]) {
    osc.frequency.setValueAtTime(f0 * k, t);
    osc.frequency.exponentialRampToValueAtTime(fPeak * k, t + dur * peakAt);
    osc.frequency.exponentialRampToValueAtTime(fEnd * k, t + dur);
  }
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .25);
  g.gain.setValueAtTime(.22, t + dur * .5); g.gain.exponentialRampToValueAtTime(.0001, t + dur + .6);
  o.connect(f); o2.connect(f); f.connect(g).connect(master);
  o.start(t); o2.start(t); o.stop(t + dur + .7); o2.stop(t + dur + .7);
}
function screech(t, dur, vol = .33) {
  const n = noise(), bp = ac.createBiquadFilter(), g = ac.createGain();
  bp.type = "bandpass"; bp.frequency.value = 2600; bp.Q.value = 9;
  const o = ac.createOscillator(), og = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
  o.type = "triangle"; lfo.frequency.value = 13; lg.gain.value = 120; lfo.connect(lg).connect(o.frequency); og.gain.value = .25;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .08);
  g.gain.setValueAtTime(vol, t + dur * .7); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.frequency.setValueAtTime(2100, t); o.frequency.linearRampToValueAtTime(1500, t + dur);
  n.connect(bp).connect(g); o.connect(og).connect(g); g.connect(master);
  n.start(t); o.start(t); lfo.start(t); n.stop(t + dur + .05); o.stop(t + dur + .05); lfo.stop(t + dur + .05);
}
function chime(t, freqs) {
  freqs.forEach((fr, i) => {
    const o = ac.createOscillator(), g = ac.createGain(), s = t + i * .09;
    o.frequency.value = fr;
    g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(.09, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + 1.6);
    o.connect(g).connect(master); o.start(s); o.stop(s + 1.7);
  });
}
function boom(t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + .8);
  g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.0001, t + 1);
  o.connect(g).connect(master); o.start(t); o.stop(t + 1.05);
}

/* ---------- title ---------- */
function fillLine(el, text) {
  el.innerHTML = ""; const chars = [];
  text.split(" ").forEach(word => {
    const w = document.createElement("span"); w.className = "word";
    [...word].forEach(ch => { const s = document.createElement("span"); s.className = "ch"; s.textContent = ch; w.appendChild(s); chars.push(s); });
    el.appendChild(w);
  });
  return chars;
}
function dropLetters() {
  const l1 = fillLine($("line1"), LINE1), l2 = fillLine($("line2"), LINE2);
  let t = 0;
  const schedule = (s, delay, big) => setTimeout(() => {
    s.classList.add("drop");
    if (live()) { const n = ac.currentTime; whistle(n, big ? .07 : .03); thud(n + .54, big ? .55 : .22); }
  }, delay);
  l1.forEach(s => { schedule(s, t, true); t += GAP1; });
  t += 250;
  l2.forEach(s => { schedule(s, t, false); t += GAP2; });
  return t + 900;
}

/* ---------- road text ---------- */
function fillRoad(el, word) {
  el.classList.remove("glow"); el.innerHTML = "";
  return [...word].map(ch => { const s = document.createElement("span"); s.textContent = ch; el.appendChild(s); return s; });
}
function revealRoad() {
  const top = fillRoad($("rtTop"), ROAD_TOP_WORD), bot = fillRoad($("rtBottom"), ROAD_BOTTOM_WORD);
  top.forEach((s, i) => setTimeout(() => s.classList.add("in"), i * 110));
  const botStart = top.length * 110 + 250;
  bot.forEach((s, i) => setTimeout(() => s.classList.add("in"), botStart + i * 130));
  if (live()) {
    const n = ac.currentTime;
    chime(n, [523.25, 659.25, 783.99, 1046.5, 1318.5]);
    boom(n + botStart / 1000);
    chime(n + botStart / 1000 + .1, [783.99, 987.77, 1174.66, 1567.98]);
  }
  setTimeout(() => {
    $("rtTop").classList.add("glow"); $("rtBottom").classList.add("glow");
    $("replay").classList.add("show");
    $("contact").classList.add("show");
  }, botStart + bot.length * 130 + 1100);
}

/* ---------- smoke + skids ---------- */
let particles = [];
function emitSmoke(x, y, amount, push = -1) {
  for (let i = 0; i < amount; i++) particles.push({
    x: x + (Math.random() - .5) * 10, y: y - Math.random() * 6,
    vx: push * (Math.random() * 1.6 + .4), vy: -Math.random() * 1.2 - .2,
    r: 6 + Math.random() * 10, a: .45 + Math.random() * .25
  });
}
(function drawSmoke() {
  sctx.clearRect(0, 0, smokeC.width, smokeC.height);
  particles = particles.filter(p => p.a > .01);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.r += .55; p.a *= .975; p.vx *= .985;
    const g = sctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, `rgba(210,214,222,${p.a})`); g.addColorStop(1, "rgba(210,214,222,0)");
    sctx.fillStyle = g; sctx.beginPath(); sctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); sctx.fill();
  }
  requestAnimationFrame(drawSmoke);
})();
let lastSkid = null;
function skid(alpha) {
  const r = $("wheelRear").getBoundingClientRect();
  const sx = r.left + r.width / 2, sy = r.bottom - 3;
  if (lastSkid) {
    kctx.strokeStyle = `rgba(8,8,8,${alpha})`; kctx.lineWidth = 7; kctx.lineCap = "round";
    kctx.beginPath(); kctx.moveTo(lastSkid.x, lastSkid.y); kctx.lineTo(sx, sy); kctx.stroke();
  }
  lastSkid = { x: sx, y: sy };
  return r;
}
function spinWheels(dx, grip = 1) {
  const wheelR = 25 * (car.clientWidth / 400) || 20;
  wheelAngle += (dx / wheelR) * (180 / Math.PI) * grip;
  wheels.forEach(w => w.style.transform = `rotate(${wheelAngle}deg)`);
}

/* ---------- car ---------- */
const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
const easeInCubic = t => t * t * t;

function driveIn(done) {
  const carW = car.clientWidth, startX = -carW - 60, endX = (innerWidth - carW) / 2;
  const t0 = performance.now(), DRIFT = .45;
  let prevX = startX;
  if (live()) { const a = ac.currentTime; engine(a, CAR_IN / 1000, 55, 190, 70); screech(a + CAR_IN / 1000 * DRIFT, CAR_IN / 1000 * .5); }
  $("headGlow").style.opacity = 1; lastSkid = null;
  (function frame(now) {
    const p = Math.min((now - t0) / CAR_IN, 1);
    const x = startX + (endX - startX) * easeOutQuart(p), dx = x - prevX; prevX = x;
    let d = 0;
    if (p > DRIFT) { const q = (p - DRIFT) / (1 - DRIFT); d = Math.sin(q * Math.PI) * (1 - q * .3); }
    car.style.transform = `translateX(${x}px) perspective(900px) rotateY(${-d * 32}deg) rotateZ(${-d}deg) translateY(${Math.sin(now / 35) * d * 1.5}px)`;
    carBody.style.transform = `rotate(${d * 3}deg)`;
    spinWheels(dx, 1 - d * .7);
    if (d > .05) { const r = skid(.35 * d + .1); emitSmoke(r.left + r.width / 2, r.bottom, Math.ceil(d * 4)); } else lastSkid = null;
    if (p < 1) requestAnimationFrame(frame); else settle(endX, done);
  })(t0);
}
function settle(x, done) {
  const t0 = performance.now();
  if (live()) thud(ac.currentTime, .4);
  (function bounce(now) {
    const t = (now - t0) / 1000, k = Math.exp(-5 * t) * Math.sin(t * 18);
    carBody.style.transform = `translateY(${k * 3}px) rotate(${k * 1.6}deg)`;
    car.style.transform = `translateX(${x}px)`;
    if (t < 1.1) requestAnimationFrame(bounce);
    else { carBody.style.transform = ""; setTimeout(() => driveOut(x, done), HOLD); }
  })(t0);
}
function driveOut(fromX, done) {
  const endX = innerWidth + 80, t0 = performance.now();
  let prevX = fromX, fired = false;
  if (live()) { const a = ac.currentTime; screech(a, .45, .22); engine(a, CAR_OUT / 1000 + .3, 70, 260, 180, .7); }
  lastSkid = null;
  (function frame(now) {
    const p = Math.min((now - t0) / CAR_OUT, 1);
    const x = fromX + (endX - fromX) * easeInCubic(p), dx = x - prevX; prevX = x;
    const squat = (1 - p) * Math.min(p * 6, 1);
    carBody.style.transform = `rotate(${-squat * 2.2}deg)`;
    car.style.transform = `translateX(${x}px)`;
    spinWheels(dx + (p < .25 ? 14 : 0));
    if (p < .25) { const r = skid(.3 * (1 - p * 4) + .05); emitSmoke(r.left + r.width / 2, r.bottom, 3, -1.2); } else lastSkid = null;
    if (!fired && p > .82) { fired = true; done(); }
    if (p < 1) requestAnimationFrame(frame); else $("headGlow").style.opacity = 0;
  })(t0);
}

/* ---------- run ---------- */
function run() {
  $("replay").classList.remove("show"); $("contact").classList.remove("show"); $("tag").classList.remove("show");
  kctx.clearRect(0, 0, skidC.width, skidC.height); particles = [];
  fillRoad($("rtTop"), ""); fillRoad($("rtBottom"), "");
  car.style.transform = "translateX(-120vw)";
  layout();
  const lettersTime = dropLetters();
  setTimeout(() => $("tag").classList.add("show"), lettersTime);
  setTimeout(() => driveIn(revealRoad), lettersTime + 400);
}
$("replay").addEventListener("click", run);
const go = () => setTimeout(run, 300);
if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(go);
else addEventListener("load", go);
</script>
</body>
